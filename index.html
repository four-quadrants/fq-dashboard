<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice View — 4Q Practice Data</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
<style>
:root{
  color-scheme: light;
  --navy:#1F3864; --blue:#3f8fd8; --blue-soft:#7fb2ea;
  --pos:#2f9e44; --neg:#A32D2D; --amber:#E07B2A;
  --bg:#faf9f7; --panel:#ffffff; --panel-2:#f5f6f8;
  --ink:#20242c; --ink-soft:#5b6472; --line:#e5e7eb; --line-2:#eef0f3;
  --side:#1F3864; --side-2:#2b4674; --side-ink:#aebbd4; --side-dim:#93a4c2; --side-line:#33507f;
  --orange:#E07B2A; --sky:#4a90d9;
}
html[data-theme="dark"]{
  color-scheme: dark;
  --navy:#8fb8ee; --blue:#5aa0e0; --blue-soft:#3f6ea8;
  --pos:#5bce6b; --neg:#e0736b; --amber:#ef8b3a;
  --bg:#14161b; --panel:#1e2128; --panel-2:#262b34;
  --ink:#e7e9ec; --ink-soft:#9aa1ab; --line:#323845; --line-2:#272c36;
  --side:#0b1220; --side-2:#2f4c79; --side-ink:#93a4c2; --side-dim:#7d8ba1; --side-line:#22314c;
  --orange:#ef8b3a; --sky:#5aa0e0;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.45}
.wrap{max-width:1560px;margin:0 auto;padding:18px 20px 60px}
.shell{display:flex;min-height:100vh}
.side{width:212px;flex:none;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:16px 12px;position:sticky;top:0;height:100vh;align-self:flex-start}
.side .sbrand{display:flex;align-items:center;gap:10px;padding:4px 6px 14px;border-bottom:1px solid var(--side-line);margin-bottom:12px;cursor:pointer}
.side .sbrand img{height:28px;width:auto;display:block}
.side .sbrand .wm{font-weight:800;font-size:12.5px;letter-spacing:.3px;line-height:1;color:#fff}
.side .sbrand .wm b{color:var(--orange)}
.side .sbrand .wm small{display:block;font-weight:500;font-size:8.5px;letter-spacing:.2px;color:var(--side-dim);margin-top:3px}
.side .nav{display:flex;flex-direction:column;gap:3px}
.side .nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;color:var(--side-dim);font-weight:500;font-size:13px;border-left:3px solid transparent;cursor:pointer;text-decoration:none}
.side .nav a .g{width:15px;height:15px;border:1.7px solid currentColor;border-radius:4px;opacity:.85;flex:none}
.side .nav a:hover{background:var(--side-2);color:#dce6f5}
.side .nav a.on{background:var(--side-2);color:#fff;border-left-color:var(--orange)}
.side .nav a.on .g{background:var(--sky);border-color:var(--sky);opacity:1}
.side .grow{flex:1}
.side .sme{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--side-dim);padding-top:10px;border-top:1px solid var(--side-line)}
.side .sme .av{width:26px;height:26px;border-radius:50%;background:var(--side-2);color:#dce6f5;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:13px 22px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:30}
.topbar h1{font-size:18px;margin:0;font-weight:700;color:var(--ink)}
.topbar .ro{font-size:11px;color:var(--ink-soft);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.topbar .sp{flex:1}
.mainpad{padding:18px 22px 60px}
@media(max-width:840px){
  .shell{flex-direction:column}
  .side{position:static;width:auto;height:auto;flex-direction:row;align-items:center;flex-wrap:wrap;padding:10px 12px;gap:6px}
  .side .sbrand{border-bottom:none;margin:0;padding:0 10px 0 4px}
  .side .nav{flex-direction:row;flex-wrap:wrap;flex:1}
  .side .nav a{border-left:none;border-bottom:3px solid transparent;padding:7px 10px}
  .side .nav a.on{border-left:none;border-bottom-color:var(--orange)}
  .side .grow{display:none}
  .side .sme{border-top:none;padding-top:0}
  .topbar{flex-wrap:wrap}
}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px;margin-bottom:6px}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:30px;height:30px;border-radius:7px;background:var(--navy);display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:5px}
.brand .mark i{background:#fff;border-radius:1px;display:block;opacity:.92}
.brand .mark i:nth-child(2){background:var(--blue-soft)}
.brand .mark i:nth-child(3){background:var(--amber)}
.brand h1{font-size:15px;margin:0;letter-spacing:.2px;color:var(--navy);font-weight:700}
.brand .sub{font-size:11px;color:var(--ink-soft);margin-top:1px}

.pickerwrap{position:relative;flex:1;min-width:260px;max-width:460px}
.pickerwrap input{width:100%;padding:9px 34px 9px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;background:var(--panel)}
.pickerwrap input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(63,143,216,.15)}
.pickerwrap .caret{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--ink-soft);pointer-events:none;font-size:12px}
.themebtn{border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);border-radius:9px;width:38px;height:38px;cursor:pointer;font-size:16px;line-height:1;flex:0 0 auto}
.themebtn:hover{border-color:var(--blue);color:var(--ink)}
.menu{position:absolute;z-index:40;top:44px;left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(20,30,50,.14);max-height:60vh;overflow:auto;display:none}
.menu.open{display:block}
.menu .opt{padding:8px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center}
.menu .opt:hover,.menu .opt.active{background:var(--panel-2)}
.menu .opt .nm{font-weight:600}
.menu .opt .meta{font-size:11px;color:var(--ink-soft);white-space:nowrap}
.menu .cnt{padding:6px 12px;font-size:11px;color:var(--ink-soft);border-bottom:1px solid var(--line-2);position:sticky;top:0;background:var(--panel)}

.phead{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin:14px 0 8px}
.phead .name{font-size:22px;font-weight:750;color:var(--navy)}
.chip{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--panel-2);color:var(--ink-soft);border:1px solid var(--line)}
.chip.ok{background:#eaf6ec;color:#256b31;border-color:#cdead3}
.chip.warn{background:#fbeceb;color:#8f2a25;border-color:#f2cfcc}
.chip.loc{background:#eef4fb;color:#1f3864;border-color:#d5e4f5}
.chip.through{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip.through.warn{background:#8f2a25;border-color:#8f2a25}
.spacer{flex:1}
.locsel select{padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:12px;color:var(--ink)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:8px 0 18px;flex-wrap:wrap}
.tab{padding:9px 14px;cursor:pointer;font-weight:600;color:var(--ink-soft);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--navy);border-color:var(--amber)}
.view{display:none}
.view.active{display:block}

.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 14px}
.kpi .lab{font-size:11px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.kpi .val{font-size:23px;font-weight:750;margin:6px 0 4px;color:var(--navy)}
.kpi .deltas{display:flex;gap:12px;font-size:12px}
.kpi .d .dl{color:var(--ink-soft);font-size:10.5px;text-transform:uppercase;letter-spacing:.3px}
.kpi .d .dv{font-weight:700}
.up{color:var(--pos)} .down{color:var(--neg)} .flat{color:var(--ink-soft)}
.hl-hi{background:rgba(47,158,68,.14);color:var(--pos);font-weight:700}
.hl-lo{background:rgba(163,45,45,.13);color:var(--neg);font-weight:700}
.hl-tag{display:inline-block;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin-left:6px;padding:1px 6px;border-radius:999px;vertical-align:middle;color:#fff}
.hl-tag.hi{background:var(--pos)} .hl-tag.lo{background:var(--neg)}
/* overview redesign */
.glance{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 15px}
.gcard .lab{font-size:11px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.gcard .val{font-size:26px;font-weight:750;margin:5px 0 2px;color:var(--navy)}
.gcard .spwrap{height:34px;margin:4px 0 9px}
.gcard .spwrap .muted{color:var(--ink-soft);font-size:11px}
.spark{display:block;width:100%;height:100%}
.gcard .chips{display:flex;gap:16px;font-size:12px}
.gcard .gchip{display:flex;gap:6px;align-items:baseline}
.gcard .gchip .cl{color:var(--ink-soft);font-size:10px;text-transform:uppercase;letter-spacing:.3px}
.gcard .gchip span:last-child{font-weight:700}
.istrip{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 2px}
.ipill{font-size:12px;font-weight:600;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink-soft)}
.ipill.good{background:rgba(47,158,68,.12);color:var(--pos);border-color:rgba(47,158,68,.3)}
.ipill.bad{background:rgba(163,45,45,.11);color:var(--neg);border-color:rgba(163,45,45,.28)}
.ipill.info{background:rgba(31,56,100,.09);color:var(--navy);border-color:rgba(31,56,100,.22)}
table.scard td .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:middle}
table.scard .dot.good{background:var(--pos)} table.scard .dot.bad{background:var(--neg)} table.scard .dot.flat{background:var(--line)}
table.scard td.sp{width:100px} table.scard td.sp .spark{height:22px}
.ovtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:2px 0 12px;flex-wrap:wrap}
.ovtop .ovcad-lab{font-size:12px;color:var(--ink-soft);font-weight:600}
.ovsplit{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;margin-top:16px}
@media(max-width:860px){.ovsplit{grid-template-columns:1fr}}
.ovsplit .panel{margin-top:0}
.ovhd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.ovhd h3{margin:0}
.ovsel{font-size:12px;color:var(--ink-soft)}
.ovsel select{padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font-size:12px;margin-left:4px}
.spotbox{height:360px}
.tgtgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 22px}
@media(max-width:640px){.tgtgrid{grid-template-columns:1fr}}
.tgt-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tgt-n{font-weight:600;color:var(--navy);font-size:12.5px}
.tgt-v{color:var(--ink-soft);font-size:11.5px}
.tgt-bar{position:relative;height:12px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;margin:5px 0 3px}
.tgt-fill{position:absolute;left:0;top:0;bottom:0;background:var(--amber);border-radius:6px}
.tgt-tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--navy)}
.tgt-f{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-soft)}
.tgt-pace{font-size:11.5px;font-weight:700}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:16px}
.panel h3{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);border-left:3px solid var(--amber);padding-left:8px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.controls select,.controls label{font-size:12.5px}
.controls select{padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 11px;cursor:pointer;font-size:12.5px;color:var(--ink-soft);font-weight:600}
.seg button.active{background:var(--navy);color:#fff}
.chk{display:inline-flex;align-items:center;gap:6px;color:var(--ink-soft);font-weight:600;cursor:pointer}
.chartbox{position:relative;height:340px}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line-2);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:var(--ink-soft);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
tbody tr:hover{background:var(--panel-2)}
.tw{overflow:auto;max-height:520px}
.muted{color:var(--ink-soft)}
.note{font-size:12px;color:var(--ink-soft);margin-top:8px}
.loading{padding:40px;text-align:center;color:var(--ink-soft)}
.spin{display:inline-block;width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--navy);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.err{background:#fbeceb;border:1px solid #f2cfcc;color:#8f2a25;padding:12px 14px;border-radius:10px}

/* home menu */
.hero{margin:22px 0 4px}
.hero h2{font-size:27px;margin:0;color:var(--navy);font-weight:750;letter-spacing:-.2px}
.hero p{margin:5px 0 0;color:var(--ink-soft);font-size:13.5px;max-width:620px}
.hero .stats{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.hero .stat{font-size:12.5px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 13px;color:var(--ink)}
.hero .stat b{color:var(--navy)}
.hero .stat.attn{cursor:pointer}
.hero .stat.attn:hover{border-color:var(--amber)}
.hero .stat.attn b{color:var(--neg)}
.hero .stat.hl{cursor:pointer}
.hero .stat.hl:hover{border-color:var(--amber)}
.hero .stat.hl b{color:var(--pos)}
.hero .stat.hl.none{cursor:default;opacity:.7}
.hero .stat.hl.none:hover{border-color:var(--line)}
.hero .stat.hl.none b{color:var(--ink)}
.hero .stat.allp{cursor:pointer}
.hero .stat.allp:hover{border-color:var(--navy)}
.hero .stat.beh{cursor:pointer}
.hero .stat.beh:hover{border-color:var(--amber)}
.hero .stat.beh b{color:var(--amber)}
.hero .stat.on{background:var(--navy);border-color:var(--navy);color:#fff}
.hero .stat.on b{color:#fff}
.hlback{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow:auto}
.hlmodal{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:760px;width:100%;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.hlmodal h3{margin:0 0 6px;font-size:15px;color:var(--ink)}
.hlmodal .hx{float:right;cursor:pointer;border:none;background:none;font-size:22px;line-height:1;color:var(--ink-soft)}
.hlrow{display:flex;gap:14px;align-items:flex-start;padding:11px 2px;border-top:1px solid var(--line);cursor:pointer}
.hlrow:hover{background:rgba(127,127,127,.06)}
.hlrow .hlname{font-weight:700;min-width:180px;color:var(--navy)}
.hlchips{display:flex;flex-wrap:wrap;gap:6px}
.hlmodal.mw{max-width:860px}
.mwcols{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:14px}
@media(max-width:640px){.mwcols{grid-template-columns:1fr}}
.mwh{font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px;border-left:3px solid var(--orange,#e8863a);padding-left:8px;margin-bottom:6px}
.mwh.red{border-color:var(--neg)}
.wreason{font-size:11.5px;margin-top:2px}
.wreason.bad{color:var(--neg)}
.wreason.warn{color:var(--amber,#c26a12)}
.hlchip{font-size:11.5px;border-radius:999px;padding:2px 9px;border:1px solid var(--line);white-space:nowrap}
.hlchip.good{background:rgba(47,158,68,.13);color:var(--pos);border-color:rgba(47,158,68,.4)}
.hlchip.bad{background:rgba(163,45,45,.12);color:var(--neg);border-color:rgba(163,45,45,.4)}
.pfbtn{border:1px solid var(--line);background:transparent;color:var(--ink-soft);border-radius:999px;padding:5px 13px;font-size:12.5px;font-weight:600;cursor:pointer}
.pfbtn:hover{border-color:var(--blue);color:var(--ink)}
th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
th.sortable:hover{color:var(--ink)}
tr.prow{cursor:pointer}
.loginwrap{min-height:70vh;display:flex;align-items:center;justify-content:center}
.loginbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:30px 28px;width:320px;max-width:92vw;text-align:center;box-shadow:0 12px 40px rgba(20,30,50,.10)}
.loginbox .mark{width:40px;height:40px;border-radius:9px;background:var(--navy);display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:6px;margin:0 auto 12px}
.loginbox .mark i{background:#fff;border-radius:1px;display:block;opacity:.92}
.loginbox .mark i:nth-child(2){background:var(--blue-soft)}
.loginbox .mark i:nth-child(3){background:var(--amber)}
.loginbox h2{margin:0;color:var(--navy);font-size:20px}
.loginbox .lsub{color:var(--ink-soft);font-size:12.5px;margin:2px 0 18px}
.loginbox input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;background:var(--panel);color:var(--ink)}
.loginbox input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(63,143,216,.15)}
.loginbox button{width:100%;margin-top:10px;padding:10px;border:0;border-radius:9px;background:var(--navy);color:#fff;font-weight:700;font-size:14px;cursor:pointer}
.loginbox button:hover{background:#16294a}
.loginerr{color:var(--neg);font-size:12.5px;min-height:16px;margin-top:10px}
.homebtn{border:1px solid var(--line);background:var(--panel);color:var(--navy);border-radius:9px;padding:0 12px;height:38px;cursor:pointer;font-weight:600;font-size:13px;flex:0 0 auto;display:none}
.homebtn.show{display:inline-block}
.brand{cursor:pointer}
.homebar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0 4px}
.homebar input[type=text],.homebar select{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink);font-size:13px}
.homebar #homeSearch{flex:1;min-width:200px}
.homecount{font-size:12px;color:var(--ink-soft);margin-left:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(224px,1fr));gap:14px;margin-top:14px}
.grouphdr{margin:24px 0 2px;font-size:13px;font-weight:750;color:var(--navy);text-transform:uppercase;letter-spacing:.4px;display:flex;align-items:center;gap:8px}
.grouphdr .gcount{font-weight:600;color:var(--ink-soft);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:11px;letter-spacing:0}
.card{background:var(--panel-2);border:1px solid var(--line);border-radius:16px;position:relative;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;display:flex;flex-direction:column;overflow:hidden;min-height:200px;padding:12px}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--amber);opacity:.7}
.card:hover{border-color:var(--blue);box-shadow:0 10px 24px rgba(20,30,50,.12);transform:translateY(-2px)}
.card .logowrap{height:84px;background:#ffffff;display:flex;align-items:center;justify-content:center;padding:12px;border:1px solid var(--line);border-radius:12px}
html[data-theme="dark"] .card .logowrap{background:#e9edf2;border-color:#cfd6e0}
.card .logowrap.onDark,html[data-theme="dark"] .card .logowrap.onDark{background:#0f1728;border-color:#24304a}
.card .logowrap img{max-height:100%;max-width:100%;object-fit:contain;display:block;filter:drop-shadow(0 0 1px rgba(0,0,0,.35))}
.card .cbody{padding:12px 3px 0}
.card .cname{font-weight:700;color:var(--navy);font-size:14.5px;line-height:1.2}
.card .cmeta{font-size:11.5px;color:var(--ink-soft);margin-top:2px}
.card .cbadges{display:flex;flex-wrap:wrap;gap:6px;padding:10px 3px 2px;margin-top:auto}
.b{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink-soft);white-space:nowrap}
.b.warn{background:#fbeceb;color:#8f2a25;border-color:#f2cfcc}
.b.due{background:#fbf0e6;color:#9a5a1e;border-color:#f0d8bf}
.b.ok{background:#eaf6ec;color:#256b31;border-color:#cdead3}
.tsum{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;font-size:12.5px}
.tsum .lbl{color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.3px;font-size:11px}
.tchip{background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--ink)}
.tchip b{color:var(--navy)}
.swot{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.swot{grid-template-columns:1fr}}
.quad{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel-2)}
.quad h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.quad.s{border-top:3px solid var(--pos)} .quad.s h4{color:var(--pos)}
.quad.w{border-top:3px solid var(--neg)} .quad.w h4{color:var(--neg)}
.quad.o{border-top:3px solid var(--blue)} .quad.o h4{color:var(--blue)}
.quad.t{border-top:3px solid var(--amber)} .quad.t h4{color:var(--amber)}
.quad ul{margin:0;padding-left:18px}
.quad li{margin:5px 0;font-size:13px;line-height:1.4}

.dhmset{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:760px){.dhmset{grid-template-columns:1fr}}
.dhcol{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.dhhd{font-weight:700;color:var(--navy);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
.dhhd .cnt{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:11px;color:var(--ink-soft);letter-spacing:0}
.dhrow{display:flex;align-items:center;gap:8px;padding:6px 2px;border-top:1px solid var(--line-2);cursor:pointer}
.dhrow:hover{background:var(--panel)}
.dhnm{font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dhmeta{font-size:11px;color:var(--ink-soft);white-space:nowrap}
.dhdot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.fresh{display:flex;flex-direction:column;gap:9px}
.fresh .frow{display:flex;align-items:center;gap:10px}
.fresh .flab{width:130px;font-size:12px;color:var(--ink-soft)}
.fresh .fbar{flex:1;height:14px;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;overflow:hidden}
.fresh .ffill{height:100%;border-radius:7px 0 0 7px;display:block;min-width:2px}
.fresh .fval{width:30px;text-align:right;font-weight:700;font-size:12px;color:var(--navy)}

.pfmv{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.pfmv{grid-template-columns:1fr}}
.mvrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line-2)}
.mvrow:first-child{border-top:none}
.mvrow .mvnm{font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mvrow .mvd{font-weight:700;white-space:nowrap}
.readnote{background:rgba(224,123,42,.08);border:1px solid rgba(224,123,42,.25);border-radius:10px;padding:9px 12px;font-size:12px;color:var(--ink-soft);margin-top:10px}
.readnote b{color:var(--amber)}
.loginbox .loginlogo{display:block;width:260px;max-width:82%;height:auto;margin:2px auto 16px}

.pdetail{display:flex;gap:16px;align-items:flex-start}
.plist{width:236px;flex:none;position:sticky;top:64px;max-height:calc(100vh - 88px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px}
.plist .psearch{position:sticky;top:0;background:var(--panel);padding-bottom:6px;z-index:1}
.plist .psearch input{width:100%;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);color:var(--ink);font-size:12.5px;padding:0 10px}
.plist .pli{padding:8px 10px;border-radius:8px;cursor:pointer;border-left:3px solid transparent;display:flex;flex-direction:column;gap:1px}
.plist .pli:hover{background:var(--panel-2)}
.plist .pli.on{background:var(--panel-2);border-left-color:var(--amber)}
.plist .pli .plnm{font-weight:600;font-size:12.5px;color:var(--ink);line-height:1.2}
.plist .pli .plmeta{font-size:10.5px;color:var(--ink-soft)}
.pmain{flex:1;min-width:0}
@media(max-width:900px){.pdetail{flex-direction:column}.plist{width:auto;position:static;max-height:230px}}
.pfdot{cursor:pointer}
.dottip{font-size:12px;color:var(--ink-soft);background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin-top:8px}

.kpi.dhcard{cursor:pointer;transition:border-color .12s,transform .12s}
.kpi.dhcard:hover{border-color:var(--amber);transform:translateY(-1px)}
.dhdetail{margin-bottom:16px}

.dhkey{display:flex;align-items:center;flex-wrap:wrap;gap:2px;margin-top:12px;padding:8px 12px;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;font-size:12px;color:var(--ink-soft)}
.dhkey b{color:var(--ink);margin-right:2px}
.dhkey .dhdot{width:9px;height:9px}

.dhcheck{width:14px;height:14px;border-radius:50%;background:var(--sky);color:#fff;font-size:9px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
.dhrow.sent{opacity:.62}

/* ---- reports ---- */
.repwrap{position:relative}
.repbtn{background:var(--navy);color:#fff;border:none;border-radius:9px;padding:8px 13px;font-size:12.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
html[data-theme="dark"] .repbtn{background:#2f4c79}
.repbtn .rcar{font-size:10px}
.repmenu{position:absolute;right:0;top:40px;background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:0 12px 30px rgba(20,30,50,.18);width:255px;overflow:hidden;z-index:60;display:none}
.repmenu.open{display:block}
.repmenu .rmh{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-mut);padding:9px 13px 5px}
.repmenu a{display:flex;align-items:center;gap:10px;padding:9px 13px;font-size:13px;color:var(--ink);text-decoration:none;cursor:pointer}
.repmenu a:hover{background:var(--panel-2)}
.repmenu a .rdt{width:8px;height:8px;border-radius:2px;background:var(--amber);flex:none}
.repmenu a small{display:block;color:var(--ink-soft);font-size:11px}
.repoverlay{position:fixed;inset:0;background:var(--bg);z-index:200;display:none;overflow:auto}
.repbar{position:sticky;top:0;display:flex;align-items:center;gap:12px;padding:12px 22px;background:var(--panel);border-bottom:1px solid var(--line);z-index:2}
.repbar .rept{font-size:15px;font-weight:700;color:var(--ink)}
.repbar .repsp{flex:1}
.repbar button{border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);border-radius:8px;padding:7px 13px;font-size:12.5px;font-weight:600;cursor:pointer}
.repbar .repclose{background:var(--navy);color:#fff;border-color:var(--navy)}
.repseg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.repseg span{padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;border-left:1px solid var(--line)}
.repseg span:first-child{border-left:none}.repseg span.on{background:var(--navy);color:#fff}
.repbody{max-width:1000px;margin:0 auto;padding:24px 22px 60px}
.rverdict{border-radius:14px;padding:18px 20px;margin-bottom:18px;border:1px solid var(--line);border-left:4px solid var(--navy);background:var(--panel)}
.rverdict.green{border-left-color:#177243}.rverdict.amber{border-left-color:#a35a13}
.rvh{font-size:18px;font-weight:750;color:var(--navy);margin-bottom:5px}
.rvp{font-size:14px;color:var(--ink-soft);line-height:1.5}
.rsigs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}
@media(max-width:720px){.rsigs{grid-template-columns:1fr}}
.rsig{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:15px;display:flex;gap:12px;border-left:4px solid var(--navy)}
.rsig.good{border-left-color:#177243}.rsig.watch,.rsig.flag{border-left-color:#a35a13}.rsig.info{border-left-color:var(--navy)}
.rsig .ric{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;flex:none;background:var(--panel-2);color:var(--ink-soft)}
.rsig.good .ric{color:#177243}.rsig.watch .ric,.rsig.flag .ric{color:#a35a13}.rsig.info .ric{color:var(--navy)}
.rsig .rst{font-weight:700;font-size:13.5px;color:var(--ink);margin-bottom:3px}
.rsig .rsd{font-size:12px;color:var(--ink-soft);line-height:1.45}
.rsig .rvv{font-size:21px;font-weight:750;color:var(--navy);margin:2px 0}
.rcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:20px}
.rcard h3{margin:0 0 2px;font-size:15px;color:var(--navy)}
.rcard .rsub{font-size:11.5px;color:var(--ink-soft);margin-bottom:8px}
.rch{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.rleg{display:flex;gap:14px;font-size:11.5px;color:var(--ink-soft);flex-wrap:wrap}
.rlg{display:inline-flex;align-items:center;gap:6px}.rsw{width:14px;height:3px;border-radius:2px;display:inline-block}.rswb{width:11px;height:11px;border-radius:2px;display:inline-block}
.rdet{background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden}
.rdet summary{list-style:none;cursor:pointer;padding:14px 18px;font-size:13px;font-weight:700;color:var(--navy);display:flex;justify-content:space-between;align-items:center}
.rdet summary::-webkit-details-marker{display:none}.rdet .cue{font-size:11px;color:var(--ink-mut);font-weight:500}
.rtbl{width:100%;border-collapse:collapse;font-size:12.5px}
.rtbl th{text-align:right;font-size:10px;text-transform:uppercase;letter-spacing:.3px;color:var(--ink-mut);padding:7px 18px;border-top:1px solid var(--line)}
.rtbl th:first-child{text-align:left}.rtbl td{padding:6px 18px;border-top:1px solid var(--line2);text-align:right}
.rtbl td:first-child{text-align:left;color:var(--ink)}.rtbl td.mut{color:var(--ink-mut)}
.rtbl .up{color:#177243;font-weight:700}.rtbl .down{color:#c0392b;font-weight:700}
.rpick{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rpick .rpl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-mut)}
.rachip{font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);cursor:pointer}
.rachip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.rdot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:8px;vertical-align:middle}
.rmini{height:5px;background:var(--line2);border-radius:3px;margin-top:4px;overflow:hidden}.rmini span{display:block;height:100%;border-radius:3px}
.rnote{padding:20px;color:var(--ink-soft)}
@media print{body.repopen>.shell{display:none!important}.repoverlay{position:static;display:block!important}.repbar .repprint,.repbar .repclose,.repseg{display:none!important}}
</style>
</head>

/* ---------- theme ---------- */
function isDark(){return document.documentElement.dataset.theme==='dark';}
function applyTheme(t){document.documentElement.dataset.theme=t;const b=document.getElementById('themeBtn');if(b)b.textContent=t==='dark'?'☀️':'🌙';}
function initTheme(){applyTheme(localStorage.getItem(LS+'_theme')||'light');
  const b=document.getElementById('themeBtn');
  if(b)b.onclick=()=>{const t=isDark()?'light':'dark';localStorage.setItem(LS+'_theme',t);applyTheme(t);rerenderCharts();};}
function rerenderCharts(){destroyCharts();if(!state.current)return;
  if(state.tab==='overview')renderOverview();else if(state.tab==='trends')renderTrends();else if(state.tab==='insights')renderInsights();else if(state.tab==='forecast')renderForecast();else if(state.tab==='swot')renderSWOT();else renderData();}

async function atList(tableId,opts){
  const args=Object.assign({baseId:BASE,tableId,pageSize:100},opts);
  const r=await window.cowork.callMcpTool(LIST_TOOL,args);
  if(r&&r.isError) throw new Error((r.content&&r.content[0]&&r.content[0].text)||'tool error');
  const data=r.structuredContent??JSON.parse(r.content[0].text);
  return (data&&data.records)||[];
}
// Dual-mode data layer: Cowork (bridge) when running as an artifact; /api proxy when deployed.
const WEB=!(typeof window!=='undefined'&&window.cowork&&window.cowork.callMcpTool);
async function apiRecords(resource,practice){
  if(WEB){
    const u='/api/data?resource='+encodeURIComponent(resource)+(practice?'&practice='+encodeURIComponent(practice.uid):'');
    const r=await fetch(u,{credentials:'same-origin'});
    if(r.status===401)throw new Error('AUTH');
    if(!r.ok){let m='data '+r.status;try{m=(await r.json()).error||m;}catch(e){}throw new Error(m);}
    return (await r.json()).records||[];
  }

  document.getElementById('fcSel').onchange=e=>{state.fcMetric=e.target.value;localStorage.setItem(LS+'_fcm',state.fcMetric);drawFcChart(ctx);drawBeatMiss(ctx);};

/* ---------- overview ---------- */
function sparkSVG(vals,color,w,h){
  const pts=vals.map((v,i)=>({v,i})).filter(p=>p.v!=null&&!isNaN(p.v));
  if(pts.length<2)return '';
  const xs=(vals.length-1)||1,mn=Math.min(...pts.map(p=>p.v)),mx=Math.max(...pts.map(p=>p.v)),rng=(mx-mn)||1;
  const px=i=>(i/xs)*(w-2)+1,py=v=>h-2-((v-mn)/rng)*(h-4);
  const d=pts.map((p,idx)=>(idx?'L':'M')+px(p.i).toFixed(1)+' '+py(p.v).toFixed(1)).join(' ');
  const last=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${px(last.i).toFixed(1)}" cy="${py(last.v).toFixed(1)}" r="2" fill="${color}"/></svg>`;
}
function ovWindows(ms){return{t12:ms.slice(-12),p12:ms.slice(-24,-12)};}
function glanceCard(k,ms){
  const def=M[k];if(!def)return '';
  const cad=state.ovCadence,i=ms.length-1,cur=ms[i],inv=(k==='adj'||k==='adjPct');
  const sp=sparkSVG(ms.slice(-12).map(m=>mval(m,k)),'#e8863a',150,34);
  let val,chips;
  if(cad==='t12'){
    const w=ovWindows(ms),cv=agg(w.t12,k),pv=w.p12.length?agg(w.p12,k):null,d=delta(cv,pv,inv);
    val=cv;chips=`<span class="gchip"><span class="cl">vs prior 12</span><span class="${d.cls}">${d.txt}</span></span>`;
  }else{
    const mom=findPrev(ms,i,1),yoy=findPrev(ms,i,12),cv=mval(cur,k),dM=delta(cv,mom?mval(mom,k):null,inv),dY=delta(cv,yoy?mval(yoy,k):null,inv);
    val=cv;chips=`<span class="gchip"><span class="cl">MoM</span><span class="${dM.cls}">${dM.txt}</span></span><span class="gchip"><span class="cl">YoY</span><span class="${dY.cls}">${dY.txt}</span></span>`;
  }
  return `<div class="gcard"><div class="lab">${def.label}</div>`
    +`<div class="val" style="color:${crColor(k,val)||'var(--navy)'}">${fmt(val,def.fmt)}</div>`
    +`<div class="spwrap">${sp||'<span class="muted">not enough history</span>'}</div>`
    +`<div class="chips">${chips}</div></div>`;
}
function overviewInsights(ms){
  const cur=ms[ms.length-1],out=[];
  const keys=(state.isOrtho?['netP','netC','collRatio','appts','newStarts','npExam']:['grossP','netP','netC','collRatio','totPat','newPat','adj','adjPct']).filter(k=>M[k]&&nzA(ms,k));
  keys.forEach(k=>{const inv=(k==='adj'||k==='adjPct');
    const s=ms.map(m=>({v:mval(m,k),ym:m.ym})).filter(p=>p.v!=null&&!isNaN(p.v));
    if(s.length<12)return;let best=s[0],worst=s[0];s.forEach(p=>{if(p.v>best.v)best=p;if(p.v<worst.v)worst=p;});
    const lab=M[k].label;
    if(best.ym===cur.ym)out.push(inv?{tone:'bad',txt:lab+' hit a record high'}:{tone:'good',txt:'Record-high '+lab.toLowerCase()});
    else if(worst.ym===cur.ym)out.push(inv?{tone:'good',txt:lab+' at its lowest on record'}:{tone:'bad',txt:'Record-low '+lab.toLowerCase()});
  });
  const sw=generateSwot();
  if(!sw.thin){if(sw.S&&sw.S[0])out.push({tone:'good',txt:sw.S[0].text});
    const wt=(sw.W||[]).concat(sw.T||[]).sort((a,b)=>b.mag-a.mag);if(wt[0])out.push({tone:'bad',txt:wt[0].text});
    if(sw.O&&sw.O[0])out.push({tone:'info',txt:sw.O[0].text});}
  const seen={},res=[];out.forEach(p=>{const key=p.txt.toLowerCase();if(!seen[key]){seen[key]=1;res.push(p);}});
  if(!res.length)res.push({tone:'info',txt:'Steady month — no records or major swings.'});
  return res.slice(0,4);
}
function overviewScorecard(ms){
  const cad=state.ovCadence,i=ms.length-1,cur=ms[i],mom=findPrev(ms,i,1),yoy=findPrev(ms,i,12),w=ovWindows(ms);
  const head=cad==='t12'
    ?`<tr><th>Metric</th><th>T12</th><th>vs prior</th><th>12-mo trend</th></tr>`
    :`<tr><th>Metric</th><th>Latest</th><th>MoM</th><th>YoY</th><th>12-mo trend</th></tr>`;
  const rows=metricKeys().filter(k=>nzA(ms,k)).map(k=>{const inv=(k==='adj'||k==='adjPct'),def=M[k];
    const sp=sparkSVG(w.t12.map(m=>mval(m,k)),'#e8863a',90,22);
    if(cad==='t12'){const cv=agg(w.t12,k),pv=w.p12.length?agg(w.p12,k):null,d=delta(cv,pv,inv),dot=d.cls==='up'?'good':(d.cls==='down'?'bad':'flat');
      return `<tr><td><span class="dot ${dot}"></span>${def.label}</td><td>${fmt(cv,def.fmt)}</td><td class="${d.cls}">${d.txt}</td><td class="sp">${sp}</td></tr>`;}
    const cv=mval(cur,k),dM=delta(cv,mom?mval(mom,k):null,inv),dY=delta(cv,yoy?mval(yoy,k):null,inv),dot=dY.cls==='up'?'good':(dY.cls==='down'?'bad':'flat');
    return `<tr><td><span class="dot ${dot}"></span>${def.label}</td><td>${fmt(cv,def.fmt)}</td><td class="${dM.cls}">${dM.txt}</td><td class="${dY.cls}">${dY.txt}</td><td class="sp">${sp}</td></tr>`;}).join('');
  return `<div class="tw"><table class="scard"><thead>${head}</thead><tbody>${rows}</tbody></table></div>`;
}

  charts.ovspot=new Chart(ctxEl,{data:{labels,datasets:ds},options:baseOpts(M[k].fmt)});

function metricSelectHTML(sel){

function renderTrends(){

function roll3(a){return a.map((v,i)=>{if(v==null)return null;const s=a.slice(Math.max(0,i-2),i+1).filter(x=>x!=null);return s.length?s.reduce((x,y)=>x+y,0)/s.length:null;});}
function windowMonths(ms,tf){
  if(!ms.length)return ms;
  if(tf==='all')return ms;
  if(tf==='ytd'){const y=ms[ms.length-1].ym.slice(0,4);return ms.filter(m=>m.ym.slice(0,4)===y);}
  const n={r12:12,r24:24,r36:36}[tf]||12;return ms.slice(-n);}
function drawTrend(){
  if(charts.tr){try{charts.tr.destroy();}catch(e){}}

  const varChip=(l,cur,prev)=>{const d=delta(cur,prev,inv);return `<span class="tchip"><b>${esc(l)}</b> <span class="${d.cls}">${d.txt}</span></span>`;};
  const lead=`<span class="lbl">${kind} —</span>`;

    const dsets=years.map((y,idx)=>{let data=MONTHS.map((_,mi)=>{const row=ms.find(m=>+m.ym.slice(0,4)===y&&+m.ym.slice(5,7)===mi+1);return row?mval(row,state.metric):null;});
      if(state.rolling)data=roll3(data);
      const fromNew=years.length-1-idx,col=fromNew===0?'#e8863a':(fromNew===1?'#9aa1ab':(isDark()?'#7fb2ea':'#3f8fd8'));
      return{label:String(y),data,borderColor:col,backgroundColor:fromNew===0?'rgba(232,134,58,.10)':col,borderDash:fromNew===1?[5,4]:[],borderWidth:fromNew===0?2.6:1.8,fill:fromNew===0,tension:.3,pointRadius:2,spanGaps:true};});
    cfg={type:'line',data:{labels:MONTHS,datasets:dsets},options:baseOpts(def.fmt)};
    totalsHTML=lead+years.map(y=>chip(y,agg(ms.filter(m=>+m.ym.slice(0,4)===y),state.metric))).join('');
    if(years.length>=2){const yv=years.slice(-2);totalsHTML+=varChip('Δ vs '+yv[0],agg(ms.filter(m=>+m.ym.slice(0,4)===yv[1]),state.metric),agg(ms.filter(m=>+m.ym.slice(0,4)===yv[0]),state.metric));}

    if(hasPrior)dsets.push({label:(curY-1)+' (prior YTD)',data:series(curY-1),borderColor:'#9aa1ab',backgroundColor:'#9aa1ab',borderDash:[5,4],tension:.3,pointRadius:2,spanGaps:true,fill:false});
    dsets.push({label:curY+' YTD',data:series(curY),borderColor:'#e8863a',backgroundColor:'rgba(232,134,58,.10)',tension:.3,pointRadius:2,spanGaps:true,fill:true});
    cfg={type:'line',data:{labels,datasets:dsets},options:baseOpts(def.fmt)};
    const sub=y=>ms.filter(m=>+m.ym.slice(0,4)===y&&+m.ym.slice(5,7)<=lastMo);
    totalsHTML=lead+chip(curY+' YTD',agg(sub(curY),state.metric))+(hasPrior?chip(curY-1+' YTD',agg(sub(curY-1),state.metric)):'');
    if(hasPrior)totalsHTML+=varChip('Δ YoY',agg(sub(curY),state.metric),agg(sub(curY-1),state.metric));
    note.textContent=`Year-to-date ${curY}${hasPrior?` vs ${curY-1}`:''} (through ${MONTHS[lastMo-1]}).`+(hasPrior?'':' No prior-year data to overlay.')+(state.rolling?' Smoothed with a trailing 3-month average.':'');

  }

function renderInsights(){
  const el=document.getElementById('v-insights'),ms=months();
  if(ms.length<3){el.innerHTML='<div class="panel"><div class="err">Not enough history yet for insights (need a few months of data).</div></div>';return;}
  const hlKeys=metricKeys().filter(k=>nzA(ms,k));
  const ymIdx=y=>{const a=String(y).split('-');return (+a[0])*12+(+a[1])-1;};
  const latestIdx=ymIdx(ms[ms.length-1].ym);
  const isRecent=ym=>{const d=latestIdx-ymIdx(ym);return d>=0&&d<=5;}; // record set within trailing 6 months (latest + prior 5)
  let anyFlag=false;
  const rows=hlKeys.map(k=>{
    const vals=ms.map(m=>({ym:m.ym,v:mval(m,k)})).filter(x=>x.v!=null&&x.v!==0&&notCovid(x.ym));
    if(!vals.length)return '';
    const inv=(k==='adj'||k==='adjPct');                 // adjustments: lower is better, so a HIGH is the bad record
    let hi=vals[0],lo=vals[0];vals.forEach(x=>{if(x.v>hi.v)hi=x;if(x.v<lo.v)lo=x;});
    const best=inv?lo:hi, worst=inv?hi:lo, bestIsMax=!inv;   // "best" column = most favorable month
    const hiR=isRecent(best.ym),loR=isRecent(worst.ym);if(hiR||loR)anyFlag=true;
    const bestTag=hiR?` <span class="hl-tag hi">${bestIsMax?'Record high':'Record low'}</span>`:'';
    const worstTag=loR?` <span class="hl-tag lo">${bestIsMax?'Record low':'Record high'}</span>`:'';
    return `<tr><td>${M[k].label}</td>`
      +`<td class="${hiR?'hl-hi':''}">${colVal(k,best.v)}</td><td class="${hiR?'hl-hi':'muted'}">${fmtMonth(best.ym)}${bestTag}</td>`
      +`<td class="${loR?'hl-lo':''}">${colVal(k,worst.v)}</td><td class="${loR?'hl-lo':'muted'}">${fmtMonth(worst.ym)}${worstTag}</td></tr>`;}).join('');
  const seasKeys=metricKeys().filter(k=>nzA(ms,k));
  if(!seasKeys.includes(state.seasMetric))state.seasMetric=seasKeys.includes('netP')?'netP':seasKeys[0];
  el.innerHTML=`
    <div class="panel"><h3>Highlights &amp; lowlights — all-time (2020 excluded)</h3>
      <div class="tw"><table><thead><tr><th>Metric</th><th>Best month</th><th>When</th><th>Weakest month</th><th>When</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="note">Best and weakest reported months across the full history, <b>excluding the 2020 COVID year</b>. Months with no data are ignored. Chips flag an all-time record set within the last 6 months (green = favorable, red = unfavorable). <b>Adjustments are inverted</b> (lower is better): the lowest month is the "best," and an all-time-high adjustment shows as a red <span class="hl-tag lo">Record high</span> in the Weakest column.${anyFlag?'':' <b>Nothing flagged this window</b> — no all-time record was set in the last 6 months.'}</div></div>
    <div class="panel"><h3>Seasonality — average by calendar month</h3>
      <div class="controls"><label>Metric <select id="seasSel">${seasKeys.map(k=>`<option value="${k}"${state.seasMetric===k?' selected':''}>${M[k].label}</option>`).join('')}</select></label></div>
      <div class="chartbox"><canvas id="seasChart"></canvas></div>
      <div class="note" id="seasNote"></div></div>`;
  document.getElementById('seasSel').onchange=e=>{state.seasMetric=e.target.value;localStorage.setItem(LS+'_seas',state.seasMetric);drawSeas();};
  drawSeas();
}
function drawSeas(){
  if(charts.seas){try{charts.seas.destroy();}catch(e){}}
  const ms=months(),k=state.seasMetric;
  const buckets=MONTHS.map(()=>[]);
  ms.forEach(m=>{const v=mval(m,k);if(v!=null&&v!==0&&notCovid(m.ym))buckets[+m.ym.slice(5,7)-1].push(v);});
  const avgs=buckets.map(b=>b.length?b.reduce((a,x)=>a+x,0)/b.length:null);
  const counts=buckets.map(b=>b.length);
  const present=avgs.map((v,i)=>({v,i})).filter(x=>x.v!=null);
  if(!present.length){document.getElementById('seasNote').textContent='No data to chart.';return;}
  const maxV=Math.max(...present.map(x=>x.v)),minV=Math.min(...present.map(x=>x.v));
  const colors=avgs.map(v=>v==null?'rgba(120,120,120,.12)':(v===maxV?'#2f9e44':(v===minV?'#A32D2D':'rgba(31,56,100,.85)')));
  charts.seas=new Chart(document.getElementById('seasChart'),{type:'bar',
    data:{labels:MONTHS,datasets:[{label:M[k].label+' (avg)',data:avgs,backgroundColor:colors,borderRadius:4}]},
    options:Object.assign(baseOpts(M[k].fmt),{plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>M[k].label+' avg: '+fmt(c.parsed.y,M[k].fmt)+' · '+counts[c.dataIndex]+' yr'+(counts[c.dataIndex]===1?'':'s')}}}})});
  const strong=present.filter(x=>x.v===maxV).map(x=>MONTHS[x.i]),weak=present.filter(x=>x.v===minV).map(x=>MONTHS[x.i]);
  const yrs=Math.max(...counts);
  document.getElementById('seasNote').innerHTML=`Average ${esc(M[k].label)} for each calendar month across up to ${yrs} year${yrs===1?'':'s'} (2020 excluded). Strongest: <b>${strong.join(', ')}</b> · weakest: <b>${weak.join(', ')}</b>.`+(ms.length<24?' Limited history — read with caution.':'');
}

/* ---------- SWOT (rule-based) ---------- */
function pctCh(a,b){return (b&&b!==0)?(a-b)/Math.abs(b)*100:null;}
function generateSwot(){
  const ms=months();if(ms.length<6)return{thin:true};
  const out={S:[],W:[],O:[],T:[]},push=(c,mag,text)=>out[c].push({mag:Math.abs(mag||0),text});
  const latest=ms[ms.length-1];
  const t12=ms.slice(-12),p12=ms.slice(-24,-12),haveP=p12.length>=6;
  if(haveP){
    [['netP','Net production'],['netC','Collections'],['totPat','Patient volume'],['netPerDay','Production per day'],['netPerPat','Revenue per patient']].forEach(([k,lab])=>{
      if(!nzA(ms,k))return;const ch=pctCh(agg(t12,k),agg(p12,k));if(ch==null)return;
      if(ch>=5)push('S',ch,`${lab} up ${ch.toFixed(0)}% over the last 12 months`);
      else if(ch<=-5)push('W',ch,`${lab} down ${Math.abs(ch).toFixed(0)}% over the last 12 months`);});
    if(nzA(ms,'newPat')){const ch=pctCh(agg(t12,'newPat'),agg(p12,'newPat'));if(ch!=null){if(ch>=8)push('S',ch,`New-patient flow up ${ch.toFixed(0)}% year over year`);else if(ch<=-8)push('T',ch,`New-patient flow down ${Math.abs(ch).toFixed(0)}% year over year`);}}
    if(nzA(ms,'adjPct')){const a=agg(t12,'adjPct'),b=agg(p12,'adjPct');if(a!=null&&b!=null){const d=a-b;if(d>=3)push('W',d,`Write-off / adjustment rate climbing (${b.toFixed(0)}% → ${a.toFixed(0)}%)`);else if(d<=-3)push('S',d,`Adjustment rate improving (${b.toFixed(0)}% → ${a.toFixed(0)}%)`);}}
  }
  if(nzA(ms,'collRatio')){const v=agg(t12,'collRatio');if(v!=null){
    if(v>=99.5)push('S',v-98,`Collections keeping pace with production (${v.toFixed(1)}% collection ratio)`);
    else if(v<97)push('W',99.5-v,`Collection ratio ${v.toFixed(1)}% — ${(99.5-v).toFixed(1)} pts under target; uncollected revenue`);
    else push('W',99.5-v,`Collection ratio ${v.toFixed(1)}% — just under the 99.5% target`);}}
  if(nzA(ms,'hyg')){const hv=agg(t12,'hygPct');if(hv!=null&&hv<25)push('O',25-hv,`Hygiene is ${hv.toFixed(0)}% of production — recare/hygiene has room to grow`);}
  if(ms.length>=4&&nzA(ms,'netP')){const prev3=ms.slice(-4,-1),avg=prev3.reduce((a,m)=>a+m.netP,0)/prev3.length;
    if(avg){const r=latest.netP/avg;if(r>=1.1)push('S',(r-1)*100,`Net production momentum — ${fmtMonth(latest.ym)} ran ${Math.round((r-1)*100)}% above its 3-month average`);else if(r<=0.9)push('W',(1-r)*100,`Net production dip — ${fmtMonth(latest.ym)} was ${Math.round((1-r)*100)}% below its 3-month average`);}}
  const ctx=forecastFY();
  if(ctx){['netP','netC'].forEach(k=>{const r=paceRow(ctx,k),lab=M[k].label.toLowerCase();
    if(r.planYtd){const pv=(r.actYtd-r.planYtd)/r.planYtd*100;if(pv>=3)push('S',pv,`Ahead of forecast on ${lab} (+${pv.toFixed(0)}% vs forecast YTD)`);else if(pv<=-3)push('T',pv,`Behind forecast on ${lab} (${pv.toFixed(0)}% vs forecast YTD)`);}
    if(r.planFull){const jv=(r.proj-r.planFull)/r.planFull*100;if(jv>=5)push('O',jv,`On pace to beat the full-year ${lab} forecast by ${jv.toFixed(0)}%`);else if(jv<=-5)push('T',jv,`Projected to finish ${jv.toFixed(0)}% under the full-year ${lab} forecast`);}});}
  if(ms.length>=12&&nzA(ms,'netP')){const buckets=MONTHS.map(()=>[]);ms.forEach(m=>{if(notCovid(m.ym))buckets[+m.ym.slice(5,7)-1].push(m.netP);});
    const avgs=buckets.map(b=>b.length?b.reduce((a,x)=>a+x,0)/b.length:null),present=avgs.map((v,i)=>({v,i})).filter(x=>x.v!=null);
    if(present.length>=6){const mx=Math.max(...present.map(x=>x.v)),mn=Math.min(...present.map(x=>x.v)),allAvg=present.reduce((a,x)=>a+x.v,0)/present.length;
      const strong=present.filter(x=>x.v===mx).map(x=>MONTHS[x.i]);
      push('O',0.5,`Historically strongest in ${strong.join(', ')} — a window to push capacity and marketing`);
      const upIdx=(+latest.ym.slice(5,7))%12,upAvg=avgs[upIdx];
      if(upAvg!=null){if(upAvg<=mn*1.03)push('T',0.5,`${MONTHS[upIdx]} is historically your softest month — plan capacity accordingly`);else if(upAvg>=allAvg*1.05)push('O',0.5,`Heading into ${MONTHS[upIdx]}, typically a strong month`);}}}
  ['S','W','O','T'].forEach(c=>{out[c].sort((a,b)=>b.mag-a.mag);out[c]=out[c].slice(0,5);});
  return out;
}
function renderSWOT(){
  const el=document.getElementById('v-swot'),sw=generateSwot();
  if(sw.thin){el.innerHTML='<div class="panel"><div class="err">Not enough history yet for a SWOT (need ~6+ months of data).</div></div>';return;}
  const quad=(key,title,cls)=>{const items=sw[key];return `<div class="quad ${cls}"><h4>${title}</h4>${items.length?`<ul>${items.map(i=>`<li>${esc(i.text)}</li>`).join('')}</ul>`:'<div class="muted" style="font-size:13px">Nothing notable right now.</div>'}</div>`;};
  el.innerHTML=`<div class="panel"><h3>SWOT — auto-generated from the numbers</h3>
    <div class="swot">${quad('S','Strengths','s')}${quad('W','Weaknesses','w')}${quad('O','Opportunities','o')}${quad('T','Threats','t')}</div>
    <div class="note">Computed deterministically from this practice's trailing-12 vs prior-12 trends, collection ratio (99.5% target), forecast pace, seasonality, and recent momentum — no AI, so it reads the same for everyone. Thresholds: production/patients ±5% YoY, new patients ±8%, forecast pace ±3%.</div></div>`;
}

/* ---------- data table ---------- */
function renderData(){
  const el=document.getElementById('v-data'),ms=months();
  if(!ms.length){el.innerHTML='<div class="panel"><div class="err">No data.</div></div>';return;}
  const t12=ms.slice(-12),p12=ms.slice(-24,-12);
  const rawKeys=metricKeys().filter(k=>!isDerived(k)&&nzA(ms,k));
  const effKeys=metricKeys().filter(k=>isDerived(k)&&nzA(ms,k));
  const totRows=rawKeys.map(k=>{const def=M[k],a=agg(t12,k),b=p12.length?agg(p12,k):null,d=delta(a,b,k==='adj');
    return `<tr><td>${def.label}</td><td>${fmt(a,def.fmt)}</td><td>${b==null?'<span class="muted">—</span>':fmt(b,def.fmt)}</td>
      <td class="${d.cls}">${d.txt}</td><td>${fmt(a/(t12.length||1),def.fmt)}</td></tr>`;}).join('');
  const effRows=effKeys.map(k=>{const def=M[k],a=agg(t12,k),b=p12.length?agg(p12,k):null,d=delta(a,b,k==='adjPct');
    return `<tr><td>${def.label}</td><td>${colVal(k,a)}</td><td>${b==null?'<span class="muted">—</span>':colVal(k,b)}</td><td class="${d.cls}">${d.txt}</td></tr>`;}).join('');
  const recent=ms.slice(-13).reverse();
  const slots=state.isOrtho?[]:activeDocSlots(ms);
  const rawCols=(state.isOrtho?['grossP','netP','netC','appts','newStarts','npExam','txConsult']:['grossP','netP','netC','adj','totPat','newPat','days','hyg']).filter(k=>nzA(ms,k));
  // recent-months columns, with each active doctor's monthly production inserted right after Net Production
  const rawSpec=[];
  rawCols.forEach(k=>{rawSpec.push({label:M[k].label,fmt:M[k].fmt,get:m=>mval(m,k)});
    if(k==='netP')slots.forEach(n=>rawSpec.push({label:docLabel(n),fmt:'money',get:m=>mval(m,'doc'+n)}));});
  if(slots.length&&rawCols.indexOf('netP')<0)slots.forEach(n=>rawSpec.push({label:docLabel(n),fmt:'money',get:m=>mval(m,'doc'+n)}));
  const effCols=effKeys;
  const rawHead=`<tr><th>Month</th>${rawSpec.map(c=>`<th>${esc(c.label)}</th>`).join('')}</tr>`;
  const rawBody=recent.map(m=>`<tr><td>${fmtMonth(m.ym)}</td>${rawSpec.map(c=>`<td>${fmt(c.get(m),c.fmt)}</td>`).join('')}</tr>`).join('');
  const effHead=`<tr><th>Month</th>${effCols.map(k=>`<th>${M[k].label}</th>`).join('')}</tr>`;
  const effBody=recent.map(m=>`<tr><td>${fmtMonth(m.ym)}</td>${effCols.map(k=>`<td>${colVal(k,mval(m,k))}</td>`).join('')}</tr>`).join('');
  // ---- providers folded INTO the Totals table: each doctor's production + share of gross (slots computed above) ----
  let provTot='';
  if(slots.length){
    const grossT=agg(t12,'grossP'),grossPr=p12.length?agg(p12,'grossP'):null,dash='<span class="muted">—</span>';
    const rows=slots.map(n=>{
      const aP=agg(t12,'doc'+n),bP=p12.length?agg(p12,'doc'+n):null,dP=delta(aP,bP);
      const aPct=grossT?aP/grossT*100:null,bPct=(bP!=null&&grossPr)?bP/grossPr*100:null,dPct=delta(aPct,bPct);
      return `<tr><td>${esc(docLabel(n))}</td><td>${fmt(aP,'money')}</td><td>${bP==null?dash:fmt(bP,'money')}</td><td class="${dP.cls}">${dP.txt}</td><td>${fmt(aP/(t12.length||1),'money')}</td></tr>`
        +`<tr><td style="padding-left:18px;color:var(--muted,#5b6472)">${esc(docLabel(n))} — % of production</td><td>${aPct==null?dash:fmt(aPct,'pct')}</td><td>${bPct==null?dash:fmt(bPct,'pct')}</td><td class="${dPct.cls}">${dPct.txt}</td><td>${dash}</td></tr>`;
    }).join('');
    provTot=`<tr><td colspan="5" style="font-weight:700;padding-top:12px">Providers — production &amp; share of gross production</td></tr>${rows}`;
  }
  el.innerHTML=`
    <div class="panel"><h3>Totals — trailing 12 vs prior 12</h3>
      <div class="tw"><table><thead><tr><th>Metric</th><th>Trailing 12</th><th>Prior 12</th><th>Change</th><th>Monthly avg</th></tr></thead><tbody>${totRows}${provTot}</tbody></table></div></div>
    <div class="panel"><h3>Efficiency — blended, trailing 12 vs prior 12</h3>
      <div class="tw"><table><thead><tr><th>Metric</th><th>Trailing 12</th><th>Prior 12</th><th>Change</th></tr></thead><tbody>${effRows}</tbody></table></div>
      <div class="note">Efficiency figures are blended over the window (sum of the numerator ÷ sum of the denominator), not an average of monthly ratios.</div></div>
    <div class="panel"><h3>Recent months — volume &amp; dollars</h3><div class="tw"><table><thead>${rawHead}</thead><tbody>${rawBody}</tbody></table></div></div>
    <div class="panel"><h3>Recent months — efficiency</h3><div class="tw"><table><thead>${effHead}</thead><tbody>${effBody}</tbody></table></div></div>`;
}

/* ---------- chart opts ---------- */
function tt(f){return{callbacks:{label:c=>c.dataset.label+': '+fmt(c.parsed.y??c.parsed.x,f)}};}
function baseOpts(f){const grid=isDark()?'rgba(255,255,255,.09)':'#eef0f3',tc=isDark()?'#9aa1ab':'#5b6472';
  return{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
  plugins:{legend:{position:'bottom',labels:{usePointStyle:true,pointStyle:'circle',boxWidth:8,boxHeight:8,font:{size:11},color:tc}},tooltip:tt(f)},
  scales:{y:{ticks:{callback:v=>fmt(v,f==='money'?'money':(f==='pct'?'pct':'int')),font:{size:11},color:tc},grid:{color:grid}},
    x:{ticks:{font:{size:11},color:tc},grid:{display:false}}}};}

/* ---------- picker ---------- */
function setupPicker(){
  const inp=document.getElementById('picker'),menu=document.getElementById('menu');
  function render(q){
    const nq=norm(q);
    const list=state.practices.filter(p=>!nq||norm(p.name).includes(nq)||norm(p.uid).includes(nq)||norm(p.type).includes(nq)||norm(p.stt).includes(nq)||norm(p.owner).includes(nq));
    const head=`<div class="cnt">${list.length} of ${state.practices.length} practices</div>`;
    menu.innerHTML=head+(list.map(p=>`<div class="opt${state.current&&state.current.id===p.id?' active':''}" data-id="${p.id}"><span class="nm">${esc(p.name)}</span><span class="meta">${esc(p.type||'')}${p.stt?' · '+esc(p.stt):''}${p.owner?' · '+esc(p.owner):''}</span></div>`).join('')||'<div class="opt muted">No matches</div>');
    menu.querySelectorAll('.opt[data-id]').forEach(o=>o.onclick=()=>pick(o.dataset.id));
  }
  function open(){render(inp.value===state.currentName?'':inp.value);menu.classList.add('open');}
  inp.addEventListener('focus',()=>{inp.select();render('');menu.classList.add('open');});
  inp.addEventListener('input',()=>{render(inp.value);menu.classList.add('open');});
  document.querySelector('.caret').addEventListener('click',()=>{inp.focus();});
  document.addEventListener('click',e=>{if(!e.target.closest('.pickerwrap'))menu.classList.remove('open');});
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){const f=menu.querySelector('.opt[data-id]');if(f)pick(f.dataset.id);}if(e.key==='Escape')menu.classList.remove('open');});
}
async function pick(id){
  const p=state.practices.find(x=>x.id===id);if(!p)return;
  document.getElementById('menu').classList.remove('open');
  showScreen('practice');
  document.getElementById('picker').value=p.name;state.currentName=p.name;
  localStorage.setItem(LS+'_pid',id);state.current=p;
  document.getElementById('stage').innerHTML='<div class="loading"><span class="spin"></span>Loading '+esc(p.name)+'…</div>';
  try{
    await loadPractice(p);
    const ms=months(),latest=ms[ms.length-1];
    state.isOrtho=latest?((latest.doctors.every(d=>d.prod===0&&d.days===0))&&(latest.appts>0||latest.newStarts>0||latest.npExam>0)):/ortho/i.test(p.type);
    renderShell();
  }catch(err){document.getElementById('stage').innerHTML='<div class="panel"><div class="err">Could not load this practice: '+esc(err.message||err)+'</div></div>';}
}

/* ---------- home menu ---------- */
function showScreen(s){state.screen=s;
  document.getElementById('home').style.display=s==='home'?'block':'none';
  document.getElementById('stage').style.display=s==='practice'?'block':'none';
  document.getElementById('portfolio').style.display=s==='portfolio'?'block':'none';
  var _dh=document.getElementById('dataHealth');if(_dh)_dh.style.display=s==='health'?'block':'none';
  document.getElementById('homeBtn').classList.toggle('show',s!=='home');
  if(s!=='practice')document.getElementById('picker').value='';
  var _navmap={portfolio:'navPortfolio',health:'navHealth',home:'navPractices'};
  var _on=_navmap[s]||(s==='practice'?'navPractices':'navPractices');
  ['navPractices','navPortfolio','navHealth'].forEach(function(n){var e=document.getElementById(n);if(e)e.classList.toggle('on',n===_on);});
  var _pt=document.getElementById('pageTitle');
  if(_pt)_pt.textContent=s==='portfolio'?'Portfolio':(s==='health'?'Data Health':(s==='practice'?'Practice View':'Practices'));
  var bs=document.getElementById('brandsub');if(bs)bs.textContent=s==='portfolio'?'Portfolio':(s==='practice'?'Practice View':'Practice Dashboard');
  window.scrollTo(0,0);}
function goHome(){destroyCharts();showScreen('home');renderHome();}
function initials(n){return (n||'').replace(/[^A-Za-z0-9 ]/g,'').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('')||'–';}
// last completed calendar month (what we expect on file)
function expectedDataYm(){const n=new Date();let y=n.getFullYear(),m=n.getMonth()-1;if(m<0){m=11;y-=1;}return y+'-'+String(m+1).padStart(2,'0');}
function ymNum(ym){const p=(ym||'').split('-');return p.length===2?(+p[0])*12+(+p[1]-1):-1;}
function monthsBehind(p){if(!p.latestMonth)return 99;const d=ymNum(expectedDataYm())-ymNum(p.latestMonth);return d>0?d:0;}
// attention = >1 month behind on data, an overdue report, or incomplete/flagged data — NOT just "last month not in yet"
function needsAttention(p){return monthsBehind(p)>=2||/overdue/i.test(p.reportStatus||'')||(p.missing&&p.missing.length>0);}
function filteredHome(){const hf=state.hf,nq=norm(hf.q);
  const list=state.practices.filter(p=>{
    if(hf.type&&p.type!==hf.type)return false;
    if(hf.stt&&p.stt!==hf.stt)return false;
    if(hf.attn&&!needsAttention(p))return false;
    if(hf.behind&&monthsBehind(p)<1)return false;
    if(nq&&!(norm(p.name).includes(nq)||norm(p.uid).includes(nq)||norm(p.type).includes(nq)||norm(p.stt).includes(nq)||norm(p.owner).includes(nq)))return false;
    return true;});
  if(hf.behind)list.sort((a,b)=>monthsBehind(b)-monthsBehind(a)||a.name.localeCompare(b.name));
  return list;}
function cardHTML(p){
  const behind=monthsBehind(p),rs=p.reportStatus||'';
  const badges=[`<span class="b ${behind>=2?'warn':(p.latestMonth?'ok':'warn')}">${p.latestMonth?'Data: '+fmtMonth(p.latestMonth):'No data'}</span>`];
  if(/overdue/i.test(rs))badges.push('<span class="b warn">Report overdue</span>');
  else if(p.reportDue)badges.push('<span class="b due">Report due</span>');
  if(p.missing&&p.missing.length)badges.push('<span class="b due">Incomplete</span>');
  if(p.trackOnly)badges.push('<span class="b">Track-only</span>');

function ymAddM(ym,d){let y=+ym.slice(0,4),m=+ym.slice(5,7)-1+d;while(m<0){m+=12;y--;}while(m>11){m-=12;y++;}return y+'-'+String(m+1).padStart(2,'0');}

const HL_MOVE_MIN=0.30;   // flag when the last 3 months are 30%+ off the same 3 months a year ago
function computeHighsLows(){
  const hist=state.portfolioHist||{},expNum=ymNum(expectedDataYm()),rows=[],watch=[];
  state.practices.forEach(p=>{
    const h=hist[p.id];if(!h)return;
    const yms=Object.keys(h).sort();if(!yms.length)return;
    const latestYm=yms[yms.length-1],behind=expNum-ymNum(latestYm),prevYm=ymAddM(latestYm,-12);
    if(behind>=2){watch.push({p,tone:'warn',sev:0,txt:'Data overdue ('+behind+' months behind)'});return;}
    if(behind<0||behind>1)return;                                  // only a freshly reported month
    let sumTot=0,sumApp=0;yms.forEach(y=>{sumTot+=h[y].totPat||0;sumApp+=h[y].appts||0;});
    const patKey=(sumTot===0&&sumApp>0)?'appts':'totPat',patLabel=patKey==='appts'?'Appointments':'Patients';
    const cur=h[latestYm],recs=[];
    const move=(key,label,fmt,minBase)=>{
      const c3=avg3(h,latestYm,key),p3=avg3(h,prevYm,key);                    // needs both 3-mo windows complete (incl. a year ago)
      if(c3==null||p3==null||p3<=0)return;
      if(minBase&&p3<minBase)return;                                         // ignore tiny-base noise
      const dev=(c3-p3)/p3;
      if(dev>=HL_MOVE_MIN)recs.push({label,fmt,dir:'high',dev,value:cur[key]});
      else if(dev<=-HL_MOVE_MIN)recs.push({label,fmt,dir:'low',dev,value:cur[key]});
    };
    move('netP','Net Production','money',1000);
    move('netC','Net Collections','money',1000);
    move(patKey,patLabel,'int',20);
    move('newPat','New Patients','int',8);
    {const c=ratio3(h,latestYm,'netC','netP'),pr=ratio3(h,prevYm,'netC','netP');   // collection ratio, 3-mo YoY
      if(c!=null&&pr!=null&&pr>0){const dev=(c-pr)/pr;
        if(dev>=HL_MOVE_MIN)recs.push({label:'Collection Ratio',fmt:'pct',dir:'high',dev,value:c});
        else if(dev<=-HL_MOVE_MIN)recs.push({label:'Collection Ratio',fmt:'pct',dir:'low',dev,value:c});}}
    if(recs.length&&behind===0&&!(p.missing&&p.missing.length))rows.push({p,ym:latestYm,recs});   // highs/lows: only current AND complete reports (no missing fields)
    const cr=blendRatio(h,latestYm,'netC','netP',3);
    if(cr!=null&&cr>0&&cr<90)watch.push({p,tone:'bad',sev:2,txt:'Collection ratio '+cr.toFixed(0)+'% (3-mo, under 90%)'});
    const ar=blendRatio(h,latestYm,'adj','grossP',3);
    if(ar!=null&&ar>35)watch.push({p,tone:'warn',sev:1,txt:'Adjustment rate '+ar.toFixed(0)+'% of gross (3-mo)'});
  });

function renderPfInsights(cohort){

  const d=document.getElementById('pfDim');if(d)d.onchange=e=>{state.pf.bdim=e.target.value;renderPortfolioBody();};

function distFmt(v,f){if(v==null||isNaN(v))return '—';if(f==='money'){var a=Math.abs(v);if(a>=1e6)return '$'+(v/1e6).toFixed(2)+'M';if(a>=1e3)return '$'+Math.round(v/1e3)+'K';return '$'+Math.round(v);}return fmt(v,f);}

function reportPulse(host){var w=repWindows();if(!w){host.innerHTML='<div class="rnote">No monthly data for this practice yet.</div>';return;}

  else if(sigs.length<3)sigs.push(repSig('good','Collections healthy','Collection ratio '+c.collR.toFixed(0)+'%.'));

function reportHygiene(host){var ms=repMonths();if(!ms.length){host.innerHTML='<div class="rnote">No monthly data yet.</div>';return;}
  var l12=ms.slice(-12),p12=ms.slice(-24,-12);var sum=function(a,k){return a.reduce(function(s,m){return s+m[k];},0);};
  var hT=sum(l12,'hyg'),gT=sum(l12,'grossP'),dT=sum(l12,'days'),hP=sum(p12,'hyg');
  var hygPct=gT?hT/gT*100:0,perDay=dT?hT/dT:0,yoy=hP?(hT-hP)/hP*100:0;
  var pcts=ms.map(function(m){return {ym:m.ym,v:m.grossP?m.hyg/m.grossP*100:0};}).filter(function(x){return x.v>0;});
  var best=pcts.reduce(function(a,b){return b.v>a.v?b:a;},pcts[0]||{v:0,ym:''}),low=pcts.reduce(function(a,b){return b.v<a.v?b:a;},pcts[0]||{v:0,ym:''});
  var green=hygPct>=25;
  var sigs=repSig(hygPct<25?'watch':'good',hygPct<25?'Below the healthy band':'In the healthy band',hygPct.toFixed(0)+'% of production — target is 25–33%.')+
    repSig('info',yoy>=0?'Holding steady':'Slipping',repMoney(hT)+' over the trailing year, '+(yoy>=0?'+':'')+yoy.toFixed(0)+'% YoY.')+
    repSig('watch','Swings month to month','Ranges '+low.v.toFixed(0)+'% ('+fmtMonth(low.ym)+') to '+best.v.toFixed(0)+'% ('+fmtMonth(best.ym)+').');
  var rows=ms.map(function(m){var pc=m.grossP?m.hyg/m.grossP*100:0;return '<tr><td>'+fmtMonth(m.ym)+'</td><td>'+repMoney(m.hyg)+'</td><td class="mut">'+repMoney(m.grossP)+'</td><td>'+pc.toFixed(1)+'%</td><td>'+(m.days?repMoney(m.hyg/m.days):'—')+'</td></tr>';}).join('');
  host.innerHTML='<div class="rverdict '+(green?'green':'amber')+'"><div class="rvh">'+(green?'Hygiene is in a healthy range.':'Hygiene is carrying a little light.')+'</div><div class="rvp">At about '+hygPct.toFixed(0)+'% of production it sits '+(green?'inside':'just under')+' the healthy 25–33% band, '+(yoy>=0?'up ':'down ')+Math.abs(yoy).toFixed(0)+'% year-over-year.</div></div>'+
    '<div class="rsigs">'+sigs+'</div>'+
    '<div class="rcard"><h3>Hygiene as a share of total production</h3><div class="rsub">The core health indicator; shaded band is the healthy range.</div>'+repChartHyg(ms)+'</div>'+
    '<details class="rdet"><summary>All months — hygiene detail <span class="cue">expand ▾</span></summary><table class="rtbl"><thead><tr><th>Month</th><th>Hygiene</th><th>Total prod</th><th>Share</th><th>Per day</th></tr></thead><tbody>'+rows+'</tbody></table></details>';}
function reportAssociate(host){var ms=repMonths();var assocs=repAssocList();if(!assocs.length){host.innerHTML='<div class="rnote">No associates on record for this practice.</div>';return;}
  var cols=['#1F3864','#E07B2A','#4a90d9','#94a7c2','#a35a13','#2f9e44','#7f92ad'];
  var picker='';if(assocs.length>1){picker='<div class="rpick"><span class="rpl">View</span><span class="rachip'+(REP.assoc==='all'?' on':'')+'" data-a="all">All associates</span>'+assocs.map(function(a){return '<span class="rachip'+(REP.assoc==String(a.slot)?' on':'')+'" data-a="'+a.slot+'">'+esc(a.name)+'</span>';}).join('')+'</div>';}
  else REP.assoc=String(assocs[0].slot);
  var bodyHtml;
  if(REP.assoc==='all'&&assocs.length>1){
    var l12=ms.slice(-12);
    var roster=assocs.map(function(a,ai){var tp=0,td=0;l12.forEach(function(m){var dd=m.doctors[a.slot-1]||{};tp+=dd.prod||0;td+=dd.days||0;});return {a:a,tp:tp,td:td,ppd:td?tp/td:0,col:cols[ai%cols.length]};});
    var poolP=roster.reduce(function(s,r){return s+r.tp;},0),poolD=roster.reduce(function(s,r){return s+r.td;},0);
    roster.forEach(function(r){r.share=poolP?r.tp/poolP*100:0;});
    var sorted=roster.slice().sort(function(a,b){return b.tp-a.tp;}),top=sorted[0];
    var mxppd=Math.max.apply(null,roster.map(function(r){return r.ppd;}))||1;
    var rrows=sorted.map(function(r){return '<tr><td><span class="rdot" style="background:'+r.col+'"></span>'+esc(r.a.name)+'</td><td>'+repMoney(r.ppd)+'<div class="rmini"><span style="width:'+(r.ppd/mxppd*100).toFixed(0)+'%;background:'+r.col+'"></span></div></td><td>'+repMoney(r.tp)+'</td><td>'+r.share.toFixed(0)+'%</td><td>'+Math.round(r.td)+'</td></tr>';}).join('');
    var legend=roster.map(function(r){return '<span class="rlg"><span class="rswb" style="background:'+r.col+'"></span>'+esc(r.a.name)+'</span>';}).join('');
    bodyHtml='<div class="rverdict green"><div class="rvh">'+assocs.length+' associates producing '+repMoney(poolP)+' together.</div><div class="rvp">'+esc(top.a.name)+' leads the group at '+top.share.toFixed(0)+'% of associate production; blended output is about '+repMoney(poolD?poolP/poolD:0)+'/day across the pool (trailing 12 months).</div></div>'+
      '<div class="rsigs"><div class="rsig info"><div class="ric">●</div><div><div class="rst">Associate production (12mo)</div><div class="rvv">'+repMoney(poolP)+'</div><div class="rsd">across '+assocs.length+' associates</div></div></div><div class="rsig info"><div class="ric">●</div><div><div class="rst">Blended per day</div><div class="rvv">'+repMoney(poolD?poolP/poolD:0)+'</div><div class="rsd">'+Math.round(poolD)+' associate-days</div></div></div><div class="rsig info"><div class="ric">●</div><div><div class="rst">Top producer</div><div class="rvv">'+esc(top.a.name.split(' ').pop())+'</div><div class="rsd">'+top.share.toFixed(0)+'% of production</div></div></div></div>'+
      '<div class="rcard"><div class="rch"><h3>Associate production by month</h3><div class="rleg">'+legend+'</div></div>'+repChartStacked(l12,assocs,cols)+'</div>'+
      '<div class="rcard"><h3>Who’s producing what</h3><div class="rsub">Each associate over the trailing 12 months. Pick a name above for their full report.</div><table class="rtbl"><thead><tr><th>Associate</th><th>Per day</th><th>Production (12mo)</th><th>Share</th><th>Days</th></tr></thead><tbody>'+rrows+'</tbody></table></div>';
  } else {
    var slot=+REP.assoc,a=assocs.filter(function(x){return x.slot===slot;})[0]||assocs[0];
    var series=ms.map(function(m){var dd=m.doctors[a.slot-1]||{};return {ym:m.ym,d:dd.days||0,p:dd.prod||0};});
    var act=series.filter(function(x){return x.d>0;});
    var totP=act.reduce(function(s,x){return s+x.p;},0),totD=act.reduce(function(s,x){return s+x.d;},0),avg=totD?totP/totD:0;
    var e6=act.slice(0,6),l6=act.slice(-6);var pe=function(a2){var tp=0,td=0;a2.forEach(function(x){tp+=x.p;td+=x.d;});return td?tp/td:0;};
    var trend=pe(e6)?(pe(l6)-pe(e6))/pe(e6)*100:0;var gaps=series.length-act.length;
    var sigs=repSig('good','Consistent per-day output',repMoney(avg)+'/day across '+Math.round(totD)+' days worked.')+
      repSig(gaps>2?'watch':'info',gaps>2?'Works intermittently':'Works a full schedule',gaps>2?('Active '+act.length+' of '+series.length+' months; '+gaps+' off months.'):('Active '+act.length+' of '+series.length+' months.'))+
      repSig('good','Trending up','Recent per-day '+(trend>=0?'+':'')+trend.toFixed(0)+'% vs early tenure.');
    var rows=series.map(function(x){return '<tr><td>'+fmtMonth(x.ym)+'</td><td>'+(x.d||'—')+'</td><td>'+(x.d?repMoney(x.p):'—')+'</td><td>'+(x.d?repMoney(x.p/x.d):'off')+'</td></tr>';}).join('');
    bodyHtml='<div class="rverdict green"><div class="rvh">'+esc(a.name)+' — '+(gaps>2?'in the chair part-time.':'a steady producer.')+'</div><div class="rvp">Turns out about '+repMoney(avg)+'/day'+(gaps>2?(', but has worked only '+act.length+' of the last '+series.length+' months — the gaps matter as much as the output.'):', working a consistent schedule.')+'</div></div>'+
      '<div class="rsigs">'+sigs+'</div>'+
      '<div class="rcard"><h3>Production per day, by month</h3><div class="rsub">Orange = months worked; grey = off. Dashed line = average.</div>'+repChartPerDay(series)+'</div>'+
      '<details class="rdet"><summary>All months — '+esc(a.name)+' detail <span class="cue">expand ▾</span></summary><table class="rtbl"><thead><tr><th>Month</th><th>Days</th><th>Production</th><th>Per day</th></tr></thead><tbody>'+rows+'</tbody></table></details>';
  }
  host.innerHTML=picker+bodyHtml;
  host.querySelectorAll('.rachip[data-a]').forEach(function(ch){ch.onclick=function(){REP.assoc=ch.getAttribute('data-a');reportAssociate(host);};});
}

    var _nh=document.getElementById('navHealth');if(_nh)_nh.onclick=function(){destroyCharts&&destroyCharts();showScreen('health');renderDataHealth();};
    if(!state.practices.length){document.getElementById('home').innerHTML='<div class="panel"><div class="err">No practices found.</div></div>';return;}
    renderHome();showScreen('home');
  }catch(err){
    if(String(err&&err.message)==='AUTH'){showLogin('');return;}
    document.getElementById('home').innerHTML='<div class="panel"><div class="err">Failed to load practices: '+esc(err.message||err)+'</div></div>';
  }
})();
</script>
